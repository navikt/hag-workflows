name: Build and deploy

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      project-id:
        required: true
        type: string
      java-version:
        required: false
        type: string
        default: 21
    secrets:
      identity-provider:
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    outputs:
      docker-image: ${{ steps.docker-push.outputs.image }}
    steps:
      - uses: actions/checkout@v7

      - name: Build
        uses: navikt/hag-workflows/.github/actions/build@main
        with:
          java-version: ${{ inputs.java-version }}

      - name: Build and push docker image
        uses: nais/docker-build-push@v0
        if: github.event_name == 'release' || (github.event_name == 'push' && (github.ref_name == 'main' || startsWith(github.ref_name, 'dev/')))
        id: docker-push
        with:
          team: helsearbeidsgiver
          project_id: ${{ inputs.project-id }}
          identity_provider: ${{ secrets.identity-provider }}

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: needs.build.outputs.docker-image != ''
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: nais/setup@v1
        with:
          team: helsearbeidsgiver

      - name: Deploy
        run: |
          nais apply .nais/app.yml \
            --environment ${{ inputs.environment }}-gcp \
            --set spec.image="${{ needs.build.outputs.docker-image }}" \
            --wait
